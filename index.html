<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🔐 One-Time Link</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      max-width: 700px;
      width: 100%;
    }
    
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      min-height: 200px;
      position: relative;
    }
    
    #loadingState {
      text-align: center;
      padding: 40px 20px;
    }
    
    .loader {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #generatorView {
      display: none;
    }
    
    #recipientView {
      display: none;
    }
    
    .page-title {
      color: #2d3748;
      font-size: 2em;
      margin-bottom: 20px;
      text-align: center;
      display: block;
      width: 100%;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #4a5568;
      font-size: 0.9em;
    }
    
    input, textarea {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1em;
      transition: all 0.3s;
      font-family: inherit;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    
    .message {
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: 12px;
      display: none;
    }
    
    .success {
      background: #c6f6d5;
      color: #22543d;
      display: block;
    }
    
    .error {
      background: #fed7d7;
      color: #742a2a;
      display: block;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: #f7fafc;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }
    
    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      font-weight: 500;
      color: #4a5568;
      font-size: 1em;
    }
    
    .checkbox-group .hint {
      color: #718096;
      font-size: 0.85em;
      font-weight: 400;
      margin-left: 4px;
    }
    
    .recipient-content {
      text-align: center;
    }
    
    .recipient-content .icon-large {
      font-size: 50px;
      margin-bottom: 20px;
      display: block;
    }
    
    .recipient-content .title {
      color: #2d3748;
      font-size: 2em;
      margin-bottom: 10px;
      text-align: center;
      display: block;
      width: 100%;
    }
    
    .recipient-box {
      background: #f7fafc;
      border-radius: 20px;
      padding: 30px;
      margin: 20px 0;
      text-align: center;
    }
    
    .recipient-box .input-field {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1.1em;
      text-align: left;
      margin-top: 10px;
    }
    
    .badge {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 50px;
      font-size: 0.85em;
      margin-top: 10px;
    }
    
    /* Result View - Generator */
    #resultView {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    
    #resultView .result-icon {
      font-size: 60px;
      display: block;
      margin-bottom: 15px;
    }
    
    #resultView .result-link-box {
      background: #f7fafc;
      border-radius: 16px;
      padding: 25px;
      margin: 20px 0;
      border: 3px solid #48bb78;
    }
    
    #resultView .result-link-label {
      font-size: 0.85em;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    #resultView .result-link-content {
      display: flex;
      gap: 10px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 5px;
      align-items: center;
    }
    
    #resultView .result-link-content input {
      border: none;
      background: transparent;
      padding: 12px 15px;
      flex: 1;
      font-family: monospace;
      font-size: 1.3em;
      color: #2d3748;
      outline: none;
    }
    
    #resultView .result-link-content button {
      background: #edf2f7;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    
    #resultView .result-link-content button:hover {
      background: #667eea;
      color: white;
    }
    
    #resultView .result-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: 600;
      margin-top: 10px;
    }
    
    /* Result View - Recipient */
    #recipientResultView {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    
    #recipientResultView .result-icon {
      font-size: 60px;
      display: block;
      margin-bottom: 15px;
    }
    
    #recipientResultView .result-title {
      color: #2d3748;
      font-size: 1.8em;
      margin-bottom: 20px;
    }
    
    #recipientResultView .result-secret-box {
      background: #f7fafc;
      border-radius: 16px;
      padding: 25px;
      margin: 20px 0;
      border: 3px solid #48bb78;
    }
    
    #recipientResultView .result-secret-label {
      font-size: 0.85em;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    #recipientResultView .result-secret-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 1.1em;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      border: 1px solid #e2e8f0;
    }
    
    #recipientResultView .result-destroyed {
      margin-top: 25px;
      padding: 15px;
      background: #fed7d7;
      border-radius: 12px;
      color: #742a2a;
      font-weight: 600;
      border: 2px solid #fc8181;
    }
    
    /* Rate limit indicator */
    .rate-limit-info {
      margin-top: 10px;
      padding: 10px 15px;
      background: #ebf8ff;
      border-radius: 8px;
      font-size: 0.85em;
      color: #2c5282;
      text-align: center;
      border: 1px solid #bee3f8;
      display: none;
    }
    
    .rate-limit-info .remaining {
      font-weight: 700;
      color: #2b6cb0;
    }
    
    @media (max-width: 600px) {
      .card {
        padding: 20px;
      }
      
      .page-title {
        font-size: 1.5em;
      }
      
      .recipient-content .title {
        font-size: 1.5em;
      }
      
      #resultView .result-link-content {
        flex-direction: column;
        padding: 15px;
      }
      
      #resultView .result-link-content button {
        width: 100%;
        padding: 12px;
      }
      
      #resultView .result-link-content input {
        font-size: 1.1em;
        text-align: center;
      }
      
      #recipientResultView .result-title {
        font-size: 1.4em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="app">
      
      <!-- LOADING -->
      <div id="loadingState">
        <div class="loader"></div>
        <h2 style="color: #2d3748; font-weight: 400;">Loading...</h2>
      </div>
      
      <!-- GENERATOR -->
      <div id="generatorView">
        <h1 class="page-title">🔐 Secure Send</h1>
        
        <div class="form-group">
          <label>🔑 Password</label>
          <input type="text" id="linkPassword" placeholder="Set a password" value="SecurePass123">
        </div>
        
        <div class="checkbox-group">
          <input type="checkbox" id="passwordlessToggle">
          <label for="passwordlessToggle">
            🔓 No password
            <span class="hint">(less secure)</span>
          </label>
        </div>
        
        <div class="form-group">
          <label>📦 Secret</label>
          <textarea id="secretMessage" placeholder="Enter your secret message...">WiFi: CoffeeShop
Password: latte123</textarea>
        </div>
        
        <button class="btn" id="generateBtn">✨ Generate</button>
        
        <div id="rateLimitInfo" class="rate-limit-info">
          ⏳ <span class="remaining">5</span> links remaining this minute
        </div>
        
        <div id="generatorMessage" class="message"></div>
      </div>
      
      <!-- RESULT VIEW (Generator) -->
      <div id="resultView">
        <span class="result-icon">✅</span>
        <h2 style="color: #2d3748; margin-bottom: 10px;">Link Generated</h2>
        
        <div class="result-link-box">
          <div class="result-link-label">🔗 Your One-Time Link</div>
          <div class="result-link-content">
            <input type="text" id="resultLinkInput" readonly value="">
            <button id="resultCopyBtn">📋 Copy</button>
          </div>
        </div>
        
        <span class="result-badge" style="background: #fed7d7; color: #c53030;">⏳ 1 hour • One use</span>
      </div>
      
      <!-- RECIPIENT -->
      <div id="recipientView"></div>
      
      <!-- RESULT VIEW (Recipient) -->
      <div id="recipientResultView">
        <span class="result-icon">🔓</span>
        <h2 class="result-title">Secret Revealed</h2>
        
        <div class="result-secret-box">
          <div class="result-secret-label">📋 Your Secret</div>
          <div class="result-secret-content" id="recipientResultSecret"></div>
        </div>
        
        <div class="result-destroyed">
          ⚠️ This link has been destroyed
        </div>
      </div>
      
    </div>
  </div>

  <script>
    (function() {
      "use strict";
      
      const loadingState = document.getElementById('loadingState');
      const generatorView = document.getElementById('generatorView');
      const recipientView = document.getElementById('recipientView');
      const resultView = document.getElementById('resultView');
      const recipientResultView = document.getElementById('recipientResultView');
      const rateLimitInfo = document.getElementById('rateLimitInfo');
      
      function showView(viewId) {
        loadingState.style.display = 'none';
        generatorView.style.display = 'none';
        recipientView.style.display = 'none';
        resultView.style.display = 'none';
        recipientResultView.style.display = 'none';
        
        if (viewId === 'loading') {
          loadingState.style.display = 'block';
        } else if (viewId === 'generator') {
          generatorView.style.display = 'block';
          updateRateLimitDisplay();
        } else if (viewId === 'recipient') {
          recipientView.style.display = 'block';
        } else if (viewId === 'result') {
          resultView.style.display = 'block';
        } else if (viewId === 'recipientResult') {
          recipientResultView.style.display = 'block';
        }
      }
      
      function updateRateLimitDisplay() {
        google.script.run
          .withSuccessHandler(function(result) {
            if (result && result.remaining !== undefined) {
              rateLimitInfo.style.display = 'block';
              document.querySelector('#rateLimitInfo .remaining').textContent = result.remaining;
            }
          })
          .withFailureHandler(function() {
            rateLimitInfo.style.display = 'none';
          })
          .getRateLimitStatus();
      }
      
      function init() {
        google.script.url.getLocation(function(location) {
          if (location.parameters.v && location.parameters.v[0] === 'view' && location.parameters.token) {
            showView('recipient');
            showRecipientView(location.parameters.token[0]);
          } else {
            showView('generator');
            initGeneratorView();
          }
        });
      }
      
      // ============ GENERATOR ============
      function initGeneratorView() {
        const passwordlessToggle = document.getElementById('passwordlessToggle');
        const linkPasswordField = document.getElementById('linkPassword');
        
        passwordlessToggle.addEventListener('change', function() {
          if (this.checked) {
            linkPasswordField.disabled = true;
            linkPasswordField.placeholder = 'No password required';
            linkPasswordField.style.opacity = '0.6';
            linkPasswordField.value = '';
          } else {
            linkPasswordField.disabled = false;
            linkPasswordField.placeholder = 'Set a password';
            linkPasswordField.style.opacity = '1';
            linkPasswordField.value = 'SecurePass123';
          }
        });
        
        const generateBtn = document.getElementById('generateBtn');
        generateBtn.addEventListener('click', function() {
          const linkPassword = document.getElementById('linkPassword').value.trim();
          const secretMessage = document.getElementById('secretMessage').value.trim();
          const isPasswordless = document.getElementById('passwordlessToggle').checked;
          
          if (!isPasswordless && !linkPassword) {
            showMessage('generatorMessage', '❌ Set a password', 'error');
            return;
          }
          
          if (!secretMessage) {
            showMessage('generatorMessage', '❌ Enter a secret', 'error');
            return;
          }
          
          generateBtn.disabled = true;
          generateBtn.innerHTML = '⏳ Generating...';
          hideMessage('generatorMessage');
          
          google.script.run
            .withSuccessHandler(function(result) {
              generateBtn.disabled = false;
              generateBtn.innerHTML = '✨ Generate';
              
              if (result && result.link) {
                showView('result');
                document.getElementById('resultLinkInput').value = result.link;
              }
            })
            .withFailureHandler(function(error) {
              generateBtn.disabled = false;
              generateBtn.innerHTML = '✨ Generate';
              showMessage('generatorMessage', error.message || '❌ Error', 'error');
            })
            .generateLink(linkPassword, secretMessage, isPasswordless);
        });
        
        document.getElementById('resultCopyBtn').addEventListener('click', function() {
          const linkInput = document.getElementById('resultLinkInput');
          linkInput.select();
          document.execCommand('copy');
          this.textContent = '✅ Copied!';
          setTimeout(() => {
            this.textContent = '📋 Copy';
          }, 2000);
        });
      }
      
      // ============ RECIPIENT ============
      function showRecipientView(token) {
        recipientView.innerHTML = `
          <div class="recipient-content">
            <div class="loader" style="margin: 40px auto 20px;"></div>
            <h2 class="title" style="font-weight: 400;">Checking...</h2>
          </div>
        `;
        
        google.script.run
          .withSuccessHandler(function(response) {
            if (!response || !response.exists) {
              recipientView.innerHTML = `
                <div class="recipient-content">
                  <span class="icon-large">❌</span>
                  <h1 class="title">Not Found</h1>
                  <div style="background: #fed7d7; padding: 15px; border-radius: 12px; color: #742a2a; margin-top: 20px;">
                    ⚠️ Expired or used
                  </div>
                </div>
              `;
              return;
            }
            
            const isPasswordless = response.passwordless || false;
            
            recipientView.innerHTML = `
              <div class="recipient-content">
                <span class="icon-large">🔐</span>
                <h1 class="title">One-Time Secret</h1>
                
                <div class="recipient-box">
                  ${isPasswordless ? `
                    <div style="margin-bottom: 20px; color: #ed8936; font-weight: 600;">
                      🔓 No password required
                    </div>
                    <button id="unlockBtn" class="btn" style="background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);">
                      🔓 Reveal
                    </button>
                  ` : `
                    <div style="margin-bottom: 20px;">
                      <label style="font-weight: 600; color: #4a5568;">🔑 Enter password</label>
                      <input type="password" id="recipientPassword" 
                             placeholder="Password" 
                             class="input-field">
                    </div>
                    <button id="unlockBtn" class="btn">🔓 Unlock</button>
                  `}
                  
                  <div id="recipientMessage" class="message"></div>
                </div>
                
                <div style="margin-top: 15px;">
                  <span class="badge" style="background: ${isPasswordless ? '#fefcbf' : '#fed7d7'}; color: ${isPasswordless ? '#744210' : '#c53030'};">
                    ${isPasswordless ? '🔓 Passwordless' : '🔑 Protected'} • ⏳ One use
                  </span>
                </div>
              </div>
            `;
            
            const unlockBtn = document.getElementById('unlockBtn');
            const pwdField = document.getElementById('recipientPassword');
            
            function attemptUnlock(password) {
              unlockBtn.disabled = true;
              unlockBtn.innerHTML = '⏳ ...';
              hideMessage('recipientMessage');
              
              google.script.run
                .withSuccessHandler(function(response) {
                  unlockBtn.disabled = false;
                  unlockBtn.innerHTML = isPasswordless ? '🔓 Reveal' : '🔓 Unlock';
                  
                  if (response && response.success) {
                    showView('recipientResult');
                    document.getElementById('recipientResultSecret').textContent = response.secret;
                  } else {
                    showMessage('recipientMessage', response.message || '❌ Failed', 'error');
                    unlockBtn.disabled = false;
                    unlockBtn.innerHTML = isPasswordless ? '🔓 Reveal' : '🔓 Unlock';
                  }
                })
                .withFailureHandler(function(error) {
                  unlockBtn.disabled = false;
                  unlockBtn.innerHTML = isPasswordless ? '🔓 Reveal' : '🔓 Unlock';
                  showMessage('recipientMessage', '❌ ' + error.message, 'error');
                })
                .consumeLink(token, password || '');
            }
            
            if (isPasswordless) {
              unlockBtn.addEventListener('click', function() {
                attemptUnlock('');
              });
            } else {
              unlockBtn.addEventListener('click', function() {
                const password = pwdField.value.trim();
                if (!password) {
                  showMessage('recipientMessage', '❌ Enter password', 'error');
                  return;
                }
                attemptUnlock(password);
              });
              pwdField.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                  unlockBtn.click();
                }
              });
            }
          })
          .withFailureHandler(function(error) {
            recipientView.innerHTML = `
              <div class="recipient-content">
                <span class="icon-large">❌</span>
                <h1 class="title">Error</h1>
                <p style="color: #718096; margin-top: 10px;">${error.message}</p>
              </div>
            `;
          })
          .checkLinkExists(token);
      }
      
      function showMessage(elementId, text, type) {
        const el = document.getElementById(elementId);
        if (el) {
          el.textContent = text;
          el.className = 'message ' + type;
          el.style.display = 'block';
        }
      }
      
      function hideMessage(elementId) {
        const el = document.getElementById(elementId);
        if (el) {
          el.style.display = 'none';
        }
      }
      
      init();
      
    })();
  </script>
</body>
</html>
