<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🔐 Private Link</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 700px; width: 100%; }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      min-height: 200px;
    }
    #loadingState { text-align: center; padding: 40px 20px; }
    .loader {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #generatorView, #recipientView, #resultView, #recipientResultView { display: none; }
    .page-title { color: #2d3748; font-size: 2em; margin-bottom: 20px; text-align: center; display: block; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; font-size: 0.9em; }
    input, textarea {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1em;
      transition: all 0.3s;
      font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    textarea { min-height: 100px; resize: vertical; }
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .message { margin-top: 15px; padding: 12px 20px; border-radius: 12px; display: none; }
    .error { background: #fed7d7; color: #742a2a; display: block; }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: #f7fafc;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
    }
    .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; }
    .checkbox-group label { margin: 0; cursor: pointer; font-weight: 500; color: #4a5568; font-size: 1em; }
    .checkbox-group .hint { color: #718096; font-size: 0.85em; margin-left: 4px; }
    .recipient-content { text-align: center; }
    .recipient-content .icon-large { font-size: 50px; margin-bottom: 20px; display: block; }
    .recipient-content .title { color: #2d3748; font-size: 2em; margin-bottom: 10px; text-align: center; display: block; }
    .recipient-box { background: #f7fafc; border-radius: 20px; padding: 30px; margin: 20px 0; text-align: center; }
    .badge { display: inline-block; padding: 5px 15px; border-radius: 50px; font-size: 0.85em; margin-top: 10px; }
    #resultView, #recipientResultView { text-align: center; padding: 20px 0; }
    #resultView .result-icon, #recipientResultView .result-icon { font-size: 60px; display: block; margin-bottom: 15px; }
    
    #resultView .result-link {
      background: #f0fff4;
      padding: 20px;
      border-radius: 16px;
      margin: 25px 0;
      word-break: break-all;
      border: 3px solid #48bb78;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 4px 12px rgba(72, 187, 120, 0.15);
    }
    #resultView .result-link input {
      border: none;
      background: transparent;
      padding: 10px;
      flex: 1;
      font-family: monospace;
      font-size: 1.25em;
      font-weight: 600;
      color: #276749;
    }
    #resultView .result-link button {
      background: #48bb78;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1em;
      color: white;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    #resultView .result-link button:hover { background: #38a169; transform: translateY(-1px); }
    
    #recipientResultView .result-secret-box {
      background: #f7fafc;
      border-radius: 16px;
      padding: 25px;
      margin: 20px 0;
      border: 3px solid #48bb78;
    }
    #recipientResultView .result-secret-label { font-size: 0.85em; color: #718096; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 10px; }
    #recipientResultView .result-secret-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 1.1em;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      border: 1px solid #e2e8f0;
    }
    #recipientResultView .result-destroyed { margin-top: 25px; padding: 15px; background: #fed7d7; border-radius: 12px; color: #742a2a; font-weight: 600; }
    .rate-limit-info { margin-top: 10px; padding: 10px 15px; background: #ebf8ff; border-radius: 8px; font-size: 0.85em; color: #2c5282; text-align: center; border: 1px solid #bee3f8; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      
      <!-- LOADING VIEW -->
      <div id="loadingState">
        <div class="loader"></div>
        <h2 style="color: #2d3748; font-weight: 400;">Loading...</h2>
      </div>
      
      <!-- GENERATOR VIEW -->
      <div id="generatorView">
        <h1 class="page-title">🔐 Share a Secret Note</h1>
        
        <div class="form-group">
          <label for="linkPassword">🔑 Password (Optional)</label>
          <input type="password" id="linkPassword" placeholder="Set a password to unlock this note">
        </div>
        
        <div class="checkbox-group">
          <input type="checkbox" id="passwordlessToggle">
          <label for="passwordlessToggle">
            🔓 No Password Required
            <span class="hint">(Anyone with the link can open it)</span>
          </label>
        </div>
        
        <div class="form-group">
          <label for="secretMessage">📦 Secret Message</label>
          <textarea id="secretMessage" placeholder="Type or paste your sensitive note here..."></textarea>
        </div>
        
        <button class="btn" id="generateBtn">✨ Create Secret Link</button>
        
        <div id="rateLimitInfo" class="rate-limit-info">
          ⏳ You can create <span class="remaining">5</span> more links this minute
        </div>
        
        <div id="generatorMessage" class="message"></div>
      </div>
      
      <!-- GENERATOR RESULT VIEW -->
      <div id="resultView">
        <span class="result-icon">✅</span>
        <h2 style="color: #2d3748; margin-bottom: 10px;">Link Ready!</h2>
        <div class="result-link">
          <input type="text" id="resultLinkInput" readonly>
          <button id="resultCopyBtn">📋 Copy Link</button>
        </div>
        <span class="badge" style="background: #fed7d7; color: #c53030;">⏳ Expires in 1 hour • Self-destructs after viewing</span>
      </div>
      
      <!-- RECIPIENT VIEW -->
      <div id="recipientView"></div>
      
      <!-- RECIPIENT RESULT VIEW -->
      <div id="recipientResultView">
        <span class="result-icon">🔓</span>
        <h2 style="color: #2d3748;">Secret Message</h2>
        
        <div class="result-secret-box">
          <div class="result-secret-label">📋 Your Message</div>
          <div class="result-secret-content" id="recipientResultSecret"></div>
        </div>
        
        <div class="result-destroyed">
          ⚠️ This message has been permanently deleted from the server. If you refresh, it will be gone forever.
        </div>
      </div>
      
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      function arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
      }

      function base64ToArrayBuffer(base64) {
        const binary = window.atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
      }

      function arrayBufferToHex(buffer) {
        return Array.from(new Uint8Array(buffer))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
      }

      function hexToArrayBuffer(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) {
          bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
        }
        return bytes.buffer;
      }

      async function deriveKeyFromPassword(password, saltBytes) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          "raw",
          enc.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );

        return await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: saltBytes,
            iterations: 100000,
            hash: "SHA-256"
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function encryptData(text, password, isPasswordless) {
        const enc = new TextEncoder();
        const encodedText = enc.encode(text);
        const iv = window.crypto.getRandomValues(new Uint8Array(12));

        let key;
        let saltBase64 = null;
        let urlFragmentKey = null;

        if (isPasswordless) {
          key = await window.crypto.subtle.generateKey(
            { name: "AES-GCM", length: 256 },
            true,
            ["encrypt", "decrypt"]
          );
          const rawKey = await window.crypto.subtle.exportKey("raw", key);
          urlFragmentKey = arrayBufferToHex(rawKey);
        } else {
          const salt = window.crypto.getRandomValues(new Uint8Array(16));
          saltBase64 = arrayBufferToBase64(salt);
          key = await deriveKeyFromPassword(password, salt);
        }

        const ciphertextBuffer = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          key,
          encodedText
        );

        return {
          ciphertext: arrayBufferToBase64(ciphertextBuffer),
          iv: arrayBufferToBase64(iv),
          salt: saltBase64,
          urlFragmentKey: urlFragmentKey
        };
      }

      async function decryptData(ciphertextB64, ivB64, passwordOrHexKey, saltB64, isPasswordless) {
        const ciphertextBuffer = base64ToArrayBuffer(ciphertextB64);
        const ivBuffer = base64ToArrayBuffer(ivB64);

        let key;
        if (isPasswordless) {
          const keyBuffer = hexToArrayBuffer(passwordOrHexKey);
          key = await window.crypto.subtle.importKey(
            "raw",
            keyBuffer,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
        } else {
          const saltBuffer = base64ToArrayBuffer(saltB64);
          key = await deriveKeyFromPassword(passwordOrHexKey, new Uint8Array(saltBuffer));
        }

        const decryptedBuffer = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(ivBuffer) },
          key,
          ciphertextBuffer
        );

        const dec = new TextDecoder();
        return dec.decode(decryptedBuffer);
      }

      const loadingState = document.getElementById('loadingState');
      const generatorView = document.getElementById('generatorView');
      const recipientView = document.getElementById('recipientView');
      const resultView = document.getElementById('resultView');
      const recipientResultView = document.getElementById('recipientResultView');
      const rateLimitInfo = document.getElementById('rateLimitInfo');

      function showView(viewId) {
        loadingState.style.display = 'none';
        generatorView.style.display = 'none';
        recipientView.style.display = 'none';
        resultView.style.display = 'none';
        recipientResultView.style.display = 'none';

        if (viewId === 'loading') loadingState.style.display = 'block';
        if (viewId === 'generator') { generatorView.style.display = 'block'; updateRateLimitDisplay(); }
        if (viewId === 'recipient') recipientView.style.display = 'block';
        if (viewId === 'result') resultView.style.display = 'block';
        if (viewId === 'recipientResult') recipientResultView.style.display = 'block';
      }

      function updateRateLimitDisplay() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.remaining !== undefined) {
              rateLimitInfo.style.display = 'block';
              document.querySelector('#rateLimitInfo .remaining').textContent = res.remaining;
            }
          })
          .getRateLimitStatus();
      }

      function init() {
        google.script.url.getLocation(function(loc) {
          if (loc.parameters.v && loc.parameters.v[0] === 'view' && loc.parameters.token) {
            showView('recipient');
            initRecipientView(loc.parameters.token[0], loc.hash);
          } else {
            showView('generator');
            initGeneratorView();
          }
        });
      }

      function initGeneratorView() {
        const toggle = document.getElementById('passwordlessToggle');
        const passField = document.getElementById('linkPassword');

        toggle.addEventListener('change', function() {
          if (this.checked) {
            passField.disabled = true;
            passField.value = '';
            passField.placeholder = 'No password needed (Link opens directly)';
            passField.style.opacity = '0.5';
          } else {
            passField.disabled = false;
            passField.placeholder = 'Set a password to unlock this note';
            passField.style.opacity = '1';
          }
        });

        const generateBtn = document.getElementById('generateBtn');
        generateBtn.addEventListener('click', async function() {
          const password = passField.value.trim();
          const secret = document.getElementById('secretMessage').value.trim();
          const isPasswordless = toggle.checked;

          if (!isPasswordless && !password) {
            showMessage('generatorMessage', '❌ Please set a password');
            return;
          }
          if (!secret) {
            showMessage('generatorMessage', '❌ Message box cannot be empty');
            return;
          }

          generateBtn.disabled = true;
          generateBtn.textContent = '⏳ Securing Message...';
          hideMessage('generatorMessage');

          try {
            const encrypted = await encryptData(secret, password, isPasswordless);

            google.script.run
              .withSuccessHandler(function(res) {
                generateBtn.disabled = false;
                generateBtn.textContent = '✨ Create Secret Link';

                if (res && res.url) {
                  let finalUrl = res.url;
                  if (isPasswordless && encrypted.urlFragmentKey) {
                    finalUrl += '#' + encrypted.urlFragmentKey;
                  }
                  showView('result');
                  document.getElementById('resultLinkInput').value = finalUrl;
                }
              })
              .withFailureHandler(function(err) {
                generateBtn.disabled = false;
                generateBtn.textContent = '✨ Create Secret Link';
                showMessage('generatorMessage', err.message || '❌ Something went wrong on our end');
              })
              .saveSecretPayload({
                ciphertext: encrypted.ciphertext,
                iv: encrypted.iv,
                salt: encrypted.salt,
                passwordless: isPasswordless
              });

          } catch (e) {
            generateBtn.disabled = false;
            generateBtn.textContent = '✨ Create Secret Link';
            showMessage('generatorMessage', '❌ Unable to secure message: ' + e.message);
          }
        });

        document.getElementById('resultCopyBtn').addEventListener('click', function() {
          const input = document.getElementById('resultLinkInput');
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(input.value).then(() => showCopySuccess(this));
          } else {
            input.select();
            document.execCommand('copy');
            showCopySuccess(this);
          }
        });
      }

      function showCopySuccess(btn) {
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy Link'; }, 2000);
      }

      function initRecipientView(token, hashFragment) {
        recipientView.innerHTML = `
          <div class="recipient-content">
            <div class="loader" style="margin: 40px auto 20px;"></div>
            <h2 class="title" style="font-weight: 400;">Checking link...</h2>
          </div>
        `;

        google.script.run
          .withSuccessHandler(function(res) {
            if (!res || !res.exists) {
              recipientView.innerHTML = `
                <div class="recipient-content">
                  <span class="icon-large">❌</span>
                  <h1 class="title">Message Not Found</h1>
                  <div class="result-destroyed" style="margin-top: 20px;">
                    ⚠️ This link has expired or the message has already been viewed and deleted.
                  </div>
                </div>
              `;
              return;
            }

            const isPasswordless = res.passwordless;
            const fragmentKey = (hashFragment || '').replace('#', '');

            recipientView.innerHTML = `
              <div class="recipient-content">
                <span class="icon-large">🔐</span>
                <h1 class="title">You Received a Secret Note</h1>
                <p style="color: #718096; margin-bottom: 20px;">Opening this message will permanently delete it from our server.</p>
                
                <div class="recipient-box">
                  ${isPasswordless ? `
                    <button id="unlockBtn" class="btn" style="background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);">
                      🔓 View Secret Message
                    </button>
                  ` : `
                    <div style="margin-bottom: 20px;">
                      <label style="font-weight: 600; color: #4a5568;">🔑 Enter Password</label>
                      <input type="password" id="recipientPassword" placeholder="Password" style="margin-top: 8px;">
                    </div>
                    <button id="unlockBtn" class="btn">🔓 Unlock Message</button>
                  `}
                  <div id="recipientMessage" class="message"></div>
                </div>
              </div>
            `;

            const unlockBtn = document.getElementById('unlockBtn');
            const pwdField = document.getElementById('recipientPassword');

            unlockBtn.addEventListener('click', function() {
              const passwordInput = !isPasswordless && pwdField ? pwdField.value.trim() : '';

              if (!isPasswordless && !passwordInput) {
                showMessage('recipientMessage', '❌ Password is required');
                return;
              }

              unlockBtn.disabled = true;
              unlockBtn.textContent = '⏳ Loading Message...';
              hideMessage('recipientMessage');

              google.script.run
                .withSuccessHandler(async function(payloadRes) {
                  if (!payloadRes || !payloadRes.success) {
                    unlockBtn.disabled = false;
                    unlockBtn.textContent = '🔓 Unlock Message';
                    showMessage('recipientMessage', payloadRes.message || '❌ Unable to open message');
                    return;
                  }

                  try {
                    const keyOrPass = isPasswordless ? fragmentKey : passwordInput;
                    if (isPasswordless && !keyOrPass) {
                      throw new Error('Link appears to be incomplete');
                    }

                    const plaintext = await decryptData(
                      payloadRes.ciphertext,
                      payloadRes.iv,
                      keyOrPass,
                      payloadRes.salt,
                      isPasswordless
                    );

                    showView('recipientResult');
                    document.getElementById('recipientResultSecret').textContent = plaintext;
                  } catch (err) {
                    unlockBtn.disabled = false;
                    unlockBtn.textContent = '🔓 Unlock Message';
                    showMessage('recipientMessage', '❌ Incorrect password or broken link.');
                  }
                })
                .withFailureHandler(function(err) {
                  unlockBtn.disabled = false;
                  unlockBtn.textContent = '🔓 Unlock Message';
                  showMessage('recipientMessage', '❌ ' + err.message);
                })
                .fetchSecretPayload(token);
            });
          })
          .checkLinkExists(token);
      }

      function showMessage(elementId, text) {
        const el = document.getElementById(elementId);
        if (el) {
          el.textContent = text;
          el.className = 'message error';
          el.style.display = 'block';
        }
      }

      function hideMessage(elementId) {
        const el = document.getElementById(elementId);
        if (el) el.style.display = 'none';
      }

      init();
    })();
  </script>
</body>
</html>
